@if (!isLoad()) {
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside
    class="bg-sidebar flex flex-col shadow-lg transition-all duration-300 z-20 flex-shrink-0"
    [style.width]="isCollapsed() ? '80px' : '260px'"
  >
    <!-- Logo -->
    <div class="flex items-center gap-3 px-4 py-5 border-b border-white/10">
      <img src="/assets/img/logo.jpg" alt="logo" class="h-10 w-10 rounded-lg flex-shrink-0" />
      @if (!isCollapsed()) {
        <h1 class="text-white text-lg font-bold tracking-tight m-0 whitespace-nowrap">{{ title }}</h1>
      }
    </div>

    <!-- Menu -->
    <nav class="mt-4 px-2 flex-1 overflow-y-auto">
      <ul class="list-none m-0 p-0 space-y-1">
        @for (item of menuItems(); track item.path) {
          @if (canShowItem(item)) {
            <li
              (click)="routerLink(item)"
              class="flex items-center gap-3 px-4 py-2.5 rounded-lg cursor-pointer transition-colors"
              [ngClass]="selected(item)
                ? 'bg-primary text-white'
                : 'text-gray-300 hover:bg-white/10 hover:text-white'"
              [title]="isCollapsed() ? item.title : ''"
            >
              <app-icon [name]="item.icon" class="text-lg flex-shrink-0" />
              @if (!isCollapsed()) {
                <span class="text-sm font-medium whitespace-nowrap">{{ item.title }}</span>
              }
            </li>
          }
        }
      </ul>
    </nav>
  </aside>

  <!-- Main area -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Header -->
    <header class="bg-white shadow-sm z-10 flex-shrink-0">
      <div class="flex items-center justify-between h-16 px-6">
        <button
          (click)="isCollapsed.set(!isCollapsed())"
          class="flex items-center justify-center w-10 h-10 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer"
        >
          <i [class]="isCollapsed() ? 'fa-solid fa-bars' : 'fa-solid fa-bars-staggered'" class="text-xl text-gray-600"></i>
        </button>

        <span class="text-lg font-semibold text-primary">{{ depTitle() }}</span>

        <a [routerLink]="['profile']" class="flex items-center justify-center w-10 h-10 rounded-full bg-primary text-white hover:bg-primary-dark transition-colors no-underline">
          <app-icon name="person" class="text-xl" />
        </a>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 bg-gray-50 overflow-y-auto">
      <div class="p-6">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
} @else {
<!-- Loading Screen -->
<div class="h-screen flex flex-col items-center justify-center bg-gray-50">
  <div class="relative">
    <div class="w-16 h-16 border-4 border-primary/20 rounded-full"></div>
    <div class="absolute top-0 left-0 w-16 h-16 border-4 border-transparent border-t-primary rounded-full animate-spin"></div>
  </div>
  <p class="mt-6 text-lg text-gray-500 font-medium">Bienvenue sur <span class="font-bold text-primary">GPET</span>...</p>
</div>
}
