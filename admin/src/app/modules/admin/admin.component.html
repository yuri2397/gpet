@if (!isLoad()) {
<nz-layout class="h-screen">
  <nz-sider
    class="!bg-[#001529] relative z-10 min-h-screen shadow-lg"
    nzCollapsible
    nzWidth="260px"
    nzBreakpoint="md"
    [nzCollapsed]="isCollapsed()"
    [nzTrigger]="null"
  >
    <!-- Logo -->
    <div class="flex items-center gap-3 px-4 py-5 border-b border-white/10">
      <img src="/assets/img/logo.jpg" alt="logo" class="h-10 w-10 rounded-lg" />
      @if (!isCollapsed()) {
        <h1 class="text-white text-lg font-bold tracking-tight m-0">{{ title }}</h1>
      }
    </div>

    <!-- Menu -->
    <nav class="mt-4 px-2">
      <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed()">
        @for (item of menuItems(); track item.path) {
          @if (canShowItem(item)) {
            <li
              nz-menu-item
              nz-tooltip
              nzTooltipPlacement="right"
              [nzTooltipTitle]="isCollapsed() ? item.title : ''"
              [nzSelected]="selected(item)"
              (click)="routerLink(item)"
              class="!rounded-lg !my-1"
            >
              <app-icon [name]="item.icon" class="text-lg align-middle" />
              <span class="ml-3 text-sm font-medium">{{ item.title }}</span>
            </li>
          }
        }
      </ul>
    </nav>
  </nz-sider>

  <nz-layout>
    <!-- Header -->
    <nz-header class="!bg-white !px-0 shadow-sm z-10">
      <div class="flex items-center justify-between h-16 px-6">
        <button
          (click)="isCollapsed.set(!isCollapsed())"
          class="flex items-center justify-center w-10 h-10 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer"
        >
          <i nz-icon [nzType]="isCollapsed() ? 'menu-unfold' : 'menu-fold'" class="text-xl text-gray-600"></i>
        </button>

        <span class="text-lg font-semibold text-primary">{{ depTitle() }}</span>

        <a [routerLink]="['profile']" class="flex items-center justify-center w-10 h-10 rounded-full bg-primary text-white hover:bg-primary-dark transition-colors no-underline">
          <app-icon name="person" class="text-xl" />
        </a>
      </div>
    </nz-header>

    <!-- Content -->
    <nz-content class="!bg-gray-50 overflow-y-auto">
      <div class="p-6">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
} @else {
<!-- Loading Screen -->
<div class="h-screen flex flex-col items-center justify-center bg-gray-50">
  <div class="relative">
    <div class="w-16 h-16 border-4 border-primary/20 rounded-full"></div>
    <div class="absolute top-0 left-0 w-16 h-16 border-4 border-transparent border-t-primary rounded-full animate-spin"></div>
  </div>
  <p class="mt-6 text-lg text-gray-500 font-medium">Bienvenue sur <span class="font-bold text-primary">GPET</span>...</p>
</div>
}
