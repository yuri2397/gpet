<div class="min-h-screen flex">
  <!-- Left: Login Form -->
  <div class="w-full lg:w-5/12 flex flex-col items-center justify-center px-8 py-12 bg-gradient-to-br from-slate-50 to-blue-50">
    <div class="w-full max-w-md">
      <div class="text-center mb-10">
        <h1 class="text-4xl font-extrabold text-primary tracking-tight">GPET</h1>
        <p class="mt-2 text-gray-500">Connectez-vous à votre compte</p>
      </div>

      <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Adresse email</label>
          <nz-form-item>
            <nz-form-control nzErrorTip="Veuillez entrer votre email">
              <input
                nz-input nzSize="large"
                type="email"
                formControlName="email"
                placeholder="nom@exemple.com"
                class="!rounded-lg"
              />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
          <nz-form-item>
            <nz-form-control nzErrorTip="Veuillez entrer votre mot de passe">
              <input
                nz-input nzSize="large"
                type="password"
                formControlName="password"
                placeholder="Votre mot de passe"
                autocomplete="off"
                class="!rounded-lg"
              />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div class="flex items-center justify-between pt-2">
          <button
            nz-button nzType="primary" nzSize="large"
            (click)="login()"
            [nzLoading]="isLoad"
            [disabled]="!validateForm.valid"
            class="!rounded-lg !px-8 !h-11 !font-semibold"
          >
            Se connecter
          </button>
          <a routerLink="/forgot-password" class="text-sm text-primary hover:text-primary-dark transition-colors">
            Mot de passe oublie ?
          </a>
        </div>
      </form>

      <p class="mt-12 text-center text-xs text-gray-400">Version {{ version }}</p>
    </div>
  </div>

  <!-- Right: Illustration -->
  <div class="hidden lg:flex flex-1 items-center justify-center bg-gradient-to-br from-primary to-primary-dark p-12">
    <img src="/assets/img/login.svg" alt="Illustration" class="max-w-lg w-full opacity-90" />
  </div>
</div>
