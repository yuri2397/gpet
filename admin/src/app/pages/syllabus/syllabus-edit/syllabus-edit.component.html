<div class="bg-white rounded-xl shadow-lg overflow-hidden">
  <div class="p-6">
    <div class="flex items-center gap-3 mb-6">
      <button (click)="onBack()" class="w-9 h-9 flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-dark transition-colors cursor-pointer">
        <app-icon name="arrow_back" />
      </button>
      <h2 class="text-xl font-semibold text-gray-800">Modification du Syllabus</h2>
    </div>
    <div class="max-w-7xl mx-auto">
      <div class="grid grid-cols-1 gap-4">
        <div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden p-6">
            <textarea
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
              rows="15"
              [placeholder]="syllabus.description"
              [(ngModel)]="syllabus.description"
            ></textarea>

            <div class="flex justify-end gap-3 mt-4">
              <button (click)="onBack()"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">
                Annuler
              </button>
              <button (click)="save()"
                class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-dark transition-colors cursor-pointer">
                @if (isLoad) {
                  <i class="fa-solid fa-spinner fa-spin mr-2"></i>
                }
                Modifier
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
