<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-blue-50 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-primary">GPET</h1>
        <p class="mt-2 text-gray-500">Reinitialisation du mot de passe</p>
      </div>

      <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()" class="space-y-4">
        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez entrer votre email">
            <input nz-input nzSize="large" type="email" formControlName="email" placeholder="Adresse email" [disabled]="true" class="!rounded-lg" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez entrer le code">
            <input nz-input nzSize="large" type="password" formControlName="code" placeholder="Code de reinitialisation" minlength="6" class="!rounded-lg" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez entrer votre mot de passe">
            <input nz-input nzSize="large" type="password" formControlName="password" placeholder="Nouveau mot de passe" minlength="6" class="!rounded-lg" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez confirmer votre mot de passe">
            <input nz-input nzSize="large" type="password" formControlName="new_password" placeholder="Confirmer le mot de passe" minlength="6" class="!rounded-lg" />
          </nz-form-control>
        </nz-form-item>

        <div class="flex items-center justify-between gap-3 pt-2">
          <button nz-button nzType="primary" nzSize="large" [nzLoading]="isLoad" [disabled]="!validateForm.valid" (click)="resetPassword()" class="!rounded-lg !px-6 !font-semibold">
            Valider
          </button>
          <button nz-button nzSize="large" (click)="returnLogin()" class="!rounded-lg">Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>
