<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-blue-50 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-primary">GPET</h1>
        <p class="mt-2 text-gray-500">Mot de passe oublie</p>
      </div>

      <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()" class="space-y-5">
        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez entrer votre email">
            <input nz-input nzSize="large" type="email" formControlName="email" placeholder="Adresse email" class="!rounded-lg" />
          </nz-form-control>
        </nz-form-item>

        <div class="flex items-center justify-between gap-3 pt-2">
          <button nz-button nzType="primary" nzSize="large" [nzLoading]="isLoad" [disabled]="!validateForm.valid" (click)="forgotPassWord()" class="!rounded-lg !px-6 !font-semibold">
            Envoyer
          </button>
          <a routerLink="/" class="no-underline">
            <button nz-button nzSize="large" class="!rounded-lg">Retour</button>
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
