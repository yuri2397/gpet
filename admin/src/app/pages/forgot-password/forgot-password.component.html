<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-blue-50 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-primary">GPET</h1>
        <p class="mt-2 text-gray-500">Mot de passe oublie</p>
      </div>

      <form [formGroup]="validateForm" (ngSubmit)="submitForm()" class="space-y-5">
        <div>
          <input
            type="email"
            formControlName="email"
            placeholder="Adresse email"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
          />
          @if (validateForm.get('email')?.invalid && validateForm.get('email')?.dirty) {
            <p class="mt-1 text-xs text-danger">Veuillez entrer votre email</p>
          }
        </div>

        <div class="flex items-center justify-between gap-3 pt-2">
          <button
            type="button"
            (click)="forgotPassWord()"
            [disabled]="!validateForm.valid || isLoad"
            class="px-6 py-3 bg-primary text-white rounded-lg font-semibold hover:bg-primary-dark transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
          >
            @if (isLoad) {
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>
            }
            Envoyer
          </button>
          <a routerLink="/" class="no-underline">
            <button type="button" class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">Retour</button>
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
