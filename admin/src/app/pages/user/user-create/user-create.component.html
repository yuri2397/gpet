<div class="p-4">
    <form [formGroup]="validateForm">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">Prenoms <span class="text-red-500">*</span></label>
                <input [(ngModel)]="user.first_name" formControlName="first_name" name="first_name" type="text" id="first_name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                @if (validateForm.get('first_name')?.invalid && validateForm.get('first_name')?.touched) {
                    <span class="text-xs text-red-500 mt-1">Le prenom est requis</span>
                }
            </div>
            <div>
                <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
                <input [(ngModel)]="user.last_name" formControlName="last_name" name="last_name" type="text" id="last_name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Adresse Email <span class="text-red-500">*</span></label>
                <input [(ngModel)]="user.email" formControlName="email" name="email" type="email" id="email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                @if (validateForm.get('email')?.invalid && validateForm.get('email')?.touched) {
                    <span class="text-xs text-red-500 mt-1">L'email est requis</span>
                }
            </div>
            <div>
                <label for="departement_id" class="block text-sm font-medium text-gray-700 mb-1">Departement</label>
                <select [disabled]="disableDep" formControlName="departement_id" name="departement_id" id="departement_id" [(ngModel)]="user.departement_id"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                    <option value="" disabled selected>Selectionner un departement</option>
                    @for (option of departements; track option) {
                        <option [ngValue]="option.id">{{ option.name }}</option>
                    }
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
                <label for="roles" class="block text-sm font-medium text-gray-700 mb-1">Roles</label>
                <select formControlName="roles" name="roles" id="roles" multiple [(ngModel)]="user.roles"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors min-h-[80px]">
                    @for (option of roles; track option) {
                        <option [ngValue]="option.name">{{ option.name.toUpperCase() }}</option>
                    }
                </select>
            </div>
        </div>
    </form>
</div>

<div class="flex justify-end gap-3 px-4 py-3 border-t border-gray-100">
    <button (click)="destroyModal(null)"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">
        Annuler
    </button>
    <button (click)="save()" [disabled]="!validateForm.valid || isLoad"
        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer inline-flex items-center gap-2">
        @if (isLoad) {
            <i class="fa-solid fa-spinner fa-spin"></i>
        }
        Ajouter
    </button>
</div>
