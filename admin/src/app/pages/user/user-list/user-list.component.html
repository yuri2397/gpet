<div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
    <div class="bg-gradient-to-r from-[#1890ff] to-[#096dd9] px-6 py-4">
        <div class="flex justify-between items-center">
            <div>
                <h5 class="text-white text-lg font-semibold">Liste des utilisateurs</h5>
            </div>
            @if (can('creer admin')) {
                <div>
                    <button (click)="openCreateModal()" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 text-white transition-colors cursor-pointer">
                        <app-icon name="add" />
                    </button>
                </div>
            }
        </div>
    </div>
    <div class="p-6">
        <div class="my-2">
            <input type="text" nzSize="large" (input)="search()" nz-input placeholder="Prenom ou Nom ou Email ..." [(ngModel)]="searchValue" />
        </div>
        <nz-table class="scroll-table" [nzLoading]="isLoad()" nzShowSizeChanger [nzPageSizeOptions]="[5,10,20,30]" #basicTable [nzData]="listOfDisplayData()" [nzBordered]="true">
            <thead>
                <tr>
                    <th>Avatar</th>
                    <th>Prenoms</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (data of basicTable.data; track data) {
                    <tr>
                        <td>AVATAR</td>
                        <td>{{ data.first_name }}</td>
                        <td>{{ data.last_name }}</td>
                        <td>{{ data.email }}</td>
                        <td>
                            <div class="flex justify-center">
                                @if (can('voir admin')) {
                                    <div>
                                        <button (click)="showUser(data)" nz-button nzShape="circle" class="color-orange">
                                            <i class="color" nz-icon nzType="eye"></i>
                                        </button>
                                    </div>
                                }
                                @if (can('supprimer admin')) {
                                    <div class="mx-3">
                                        <button nz-popconfirm nzPopconfirmTitle="Confirmer votre action." (nzOnConfirm)="deleteUser(data)" nz-button nzType="primary" nzShape="circle" nzDanger>
                                            <i nz-icon nzType="delete"></i>
                                        </button>
                                    </div>
                                }
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </nz-table>
    </div>
</div>
