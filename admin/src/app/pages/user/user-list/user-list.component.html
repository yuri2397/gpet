<div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
    <div class="bg-gradient-to-r from-[#1890ff] to-[#096dd9] px-6 py-4">
        <div class="flex justify-between items-center">
            <div>
                <h5 class="text-white text-lg font-semibold">Liste des utilisateurs</h5>
            </div>
            @if (can('creer admin')) {
                <div>
                    <button (click)="openCreateModal()" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 text-white transition-colors cursor-pointer">
                        <app-icon name="add" />
                    </button>
                </div>
            }
        </div>
    </div>
    <div class="p-6">
        <div class="my-2">
            <input type="text" (input)="search()" placeholder="Prenom ou Nom ou Email ..." [(ngModel)]="searchValue"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" />
        </div>
        <app-data-table [data]="listOfDisplayData()" [loading]="isLoad()" #dataTable>
            <thead>
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Avatar</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Prenoms</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nom</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (data of dataTable.pageData(); track data) {
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                        <td class="px-4 py-3 text-sm text-gray-700">AVATAR</td>
                        <td class="px-4 py-3 text-sm text-gray-700">{{ data.first_name }}</td>
                        <td class="px-4 py-3 text-sm text-gray-700">{{ data.last_name }}</td>
                        <td class="px-4 py-3 text-sm text-gray-700">{{ data.email }}</td>
                        <td class="px-4 py-3">
                            <div class="flex justify-center gap-2">
                                @if (can('voir admin')) {
                                    <button (click)="showUser(data)" class="w-8 h-8 flex items-center justify-center rounded-full bg-orange-50 text-orange-500 hover:bg-orange-100 transition-colors cursor-pointer" title="Voir">
                                        <i class="fa-solid fa-eye text-sm"></i>
                                    </button>
                                }
                                @if (can('supprimer admin')) {
                                    <button (click)="deleteUser(data)" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-100 transition-colors cursor-pointer" title="Supprimer">
                                        <i class="fa-solid fa-trash text-sm"></i>
                                    </button>
                                }
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </app-data-table>
    </div>
</div>
