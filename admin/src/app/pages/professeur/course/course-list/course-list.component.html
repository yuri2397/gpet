<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="bg-gradient-to-r from-[#1890ff] to-[#096dd9] px-6 py-4">
        <div class="flex justify-between items-center">
            <div>
                <h5 class="text-white">Mes cours</h5>
            </div>
        </div>
    </div>
    <div class="p-6">
        @if (isLoad) {
            <div class="flex justify-center py-8">
                <span class="inline-block w-8 h-8 border-4 border-primary/30 border-t-primary rounded-full animate-spin"></span>
            </div>
        } @else {
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Code</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Intitule</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Service</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Semestre</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Classe</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        @for (data of professor.courses; track data) {
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-4 py-3 text-sm">{{ data.acronym }}</td>
                                <td class="px-4 py-3 text-sm">{{ data.name }}</td>
                                <td class="px-4 py-3 text-sm">{{ data.service.name }}</td>
                                <td class="px-4 py-3 text-sm">{{ data.semester.name }}</td>
                                <td class="px-4 py-3 text-sm">{{ data.classe.name }}</td>
                                <td class="px-4 py-3 text-sm text-center">
                                    <div class="flex justify-center">
                                        <div>
                                            <button class="w-9 h-9 flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-dark transition-colors cursor-pointer" (click)="openAddHourModal(data)">
                                                <app-icon name="pending_actions" />
                                            </button>
                                        </div>
                                        <div class="mx-2">
                                            <button class="w-9 h-9 flex items-center justify-center rounded-full bg-red-500 text-white hover:bg-red-600 transition-colors cursor-pointer" (click)="openDeleteConf(data)">
                                                <app-icon name="delete" />
                                            </button>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        }
                    </tbody>
                </table>
            </div>
        }
    </div>
</div>

<!-- ADD HOURS MODAL -->
@if (addHourModalVisible) {
    <div class="fixed inset-0 z-50 flex items-center justify-center">
        <div class="fixed inset-0 bg-black/50" (click)="addHourModalClose()"></div>
        <div class="relative bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold">Pointage des heures de cours</h3>
            </div>
            <div class="p-6">
                <form [formGroup]="addHourForm" (ngSubmit)="submitAddHourForm()">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="hours" class="block text-sm font-medium text-gray-700 mb-1">Nombre d'heures <span class="text-red-500">*</span></label>
                            <input [(ngModel)]="hours" formControlName="hours" min="1" max="100" name="hours" type="number" id="hours" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" />
                        </div>
                        <div>
                            <label for="cdDate" class="block text-sm font-medium text-gray-700 mb-1">Date <span class="text-red-500">*</span></label>
                            <input [(ngModel)]="cdDate" formControlName="cdDate" name="cdDate" type="date" id="cdDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" />
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Professeur</label>
                            <input [disabled]="true" value="{{ professor.first_name + ' ' + professor.last_name }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-100 cursor-not-allowed" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cours</label>
                            <input [disabled]="true" value="{{ selectedCourse.name }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-100 cursor-not-allowed" />
                        </div>
                    </div>
                </form>
            </div>
            <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
                <button (click)="addHourModalClose()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                    Annuler
                </button>
                <button (click)="addHour()" [disabled]="!addHourForm.valid" class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-medium hover:bg-primary-dark transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    @if (addHourLaod) {
                        <span class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin mr-2"></span>
                    }
                    Valider
                </button>
            </div>
        </div>
    </div>
}
