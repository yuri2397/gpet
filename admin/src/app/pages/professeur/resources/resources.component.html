<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="bg-gradient-to-r from-[#1890ff] to-[#096dd9] px-6 py-4">
        <h3 class="text-white font-semibold text-lg m-0">Ressources de vos cours</h3>
    </div>
    <div class="p-6 mx-5">
        <div class="flex justify-between items-start">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <app-icon name="search" />
                </div>
                <input type="text" placeholder="Rechercher vos cours" [(ngModel)]="inputValue"
                    (input)="onSearch($event)"
                    class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" />
                @if (searchLoad) {
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <span class="inline-block w-4 h-4 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></span>
                    </div>
                }
            </div>
        </div>
        @if (options && options.length > 0) {
            <div class="mt-2 border border-gray-200 rounded-lg shadow-sm max-h-60 overflow-y-auto">
                @for (option of options; track option) {
                    <button (click)="itemSelected(option.id)" class="w-full px-4 py-3 flex justify-between items-center hover:bg-gray-50 transition-colors text-left border-b border-gray-100 last:border-b-0">
                        <span>{{ option.name }}</span>
                        <span class="text-sm text-gray-500">{{ option.classe.name }}</span>
                    </button>
                }
            </div>
        }
        <br>
        <div>
            @if (selectedCourse) {
                <div class="flex flex-col items-center">
                    <h3 class="font-semibold text-lg m-0">{{ selectedCourse.classe.name }} <br><br> {{ selectedCourse.name }}</h3>
                    <div class="w-full mt-4 border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-primary transition-colors">
                        <input type="file" multiple (change)="onFileSelected($event)" class="hidden" #fileInput />
                        <button (click)="fileInput.click()" class="flex flex-col items-center mx-auto">
                            <app-icon name="cloud_upload" />
                            <p class="mt-2 text-sm text-gray-600">Cliquez ou faites glisser le fichier dans cette zone pour le telecharger</p>
                            <p class="mt-1 text-xs text-gray-400">
                                Prise en charge d'un telechargement unique ou en masse. Interdiction stricte de
                                telecharger des donnees d'entreprise ou d'autres fichiers de bande.
                            </p>
                        </button>
                    </div>
                </div>
            } @else {
                <div class="flex flex-col items-center">
                    <img src="/assets/img/upload.gif" alt="IMAGE GIF" class="w-[250px]">
                    <h3 class="font-semibold text-lg m-0">Rechercher un cours et uploader les ressources.</h3>
                </div>
            }
        </div>
    </div>
</div>
