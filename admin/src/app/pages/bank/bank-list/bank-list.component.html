<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="bg-gradient-to-r from-[#1890ff] to-[#096dd9] px-6 py-4">
        <div class="flex items-center justify-start">
            @if (can('creer semestre')) {
                <div class="mx-2">
                    <h5 class="text-white mx-2 inline-block text-lg font-semibold">Liste des banques</h5>
                </div>
            }
        </div>
    </div>
    <div class="p-6">
        <app-data-table [data]="banks()" [loading]="isLoad()" #dataTable>
            <thead>
                <tr class="text-center">
                    <th class="text-left text-xs font-semibold text-gray-500 uppercase tracking-wider px-4 py-3 text-center">Code</th>
                    <th class="text-left text-xs font-semibold text-gray-500 uppercase tracking-wider px-4 py-3 text-center">Nom</th>
                    <th class="text-left text-xs font-semibold text-gray-500 uppercase tracking-wider px-4 py-3 text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (data of dataTable.pageData(); track data.id) {
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                        <td class="px-4 py-3 text-sm text-gray-700 text-center">{{ data.code }}</td>
                        <td class="px-4 py-3 text-sm text-gray-700 text-center">{{ data.name }}</td>
                        <td class="px-4 py-3 text-sm text-gray-700 p-0">
                            <div class="flex justify-center">
                                @if (can('modifier salle')) {
                                    <div class="mx-3">
                                        <button class="w-8 h-8 flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-dark transition-colors cursor-pointer text-xs" (click)="openEditModal(data)">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                    </div>
                                }
                                @if (can('supprimer banque')) {
                                    <div class="mx-3">
                                        <button class="w-8 h-8 flex items-center justify-center rounded-full bg-danger text-white hover:bg-red-600 transition-colors cursor-pointer text-xs" (click)="openDeleteModal(data)">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                }
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </app-data-table>
    </div>
</div>
