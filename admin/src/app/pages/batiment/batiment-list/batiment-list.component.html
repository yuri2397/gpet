<div>
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="bg-gradient-to-r from-primary to-primary-dark px-6 py-4">
      <div class="flex items-center justify-between">
        <h3 class="text-white font-semibold text-lg m-0">Liste des batiments</h3>
        @if (can('creer batiment')) {
          <button (click)="openCreateModal()" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 text-white transition-colors cursor-pointer">
            <app-icon name="add" class="text-xl" />
          </button>
        }
      </div>
    </div>
    <div class="p-6">
      <nz-table [nzLoading]="isLoad()" nzShowSizeChanger [nzPageSizeOptions]="[5,10,20,30]" #basicTable [nzData]="batiments()" [nzBordered]="false" nzSize="middle">
        <thead>
          <tr>
            <th>Nom</th>
            <th class="text-center w-40">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (data of basicTable.data; track data.id) {
            <tr>
              <td>{{ data.name }}</td>
              <td>
                <div class="flex items-center justify-center gap-2">
                  @if (can('modifier salle')) {
                    <button nz-button nzType="primary" nzShape="circle" nzSize="small" (click)="openEditModal(data)">
                      <i nz-icon nzType="edit"></i>
                    </button>
                  }
                  @if (can('supprimer salle')) {
                    <button nz-button nzDanger nzType="primary" nzShape="circle" nzSize="small" (click)="openDeleteModal(data)">
                      <i nz-icon nzType="delete"></i>
                    </button>
                  }
                </div>
              </td>
            </tr>
          }
        </tbody>
      </nz-table>
    </div>
  </div>
</div>
