<div>
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="bg-gradient-to-r from-primary to-primary-dark px-6 py-4">
      <div class="flex items-center justify-between">
        <h3 class="text-white font-semibold text-lg m-0">Liste des batiments</h3>
        @if (can('creer batiment')) {
          <button (click)="openCreateModal()" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 text-white transition-colors cursor-pointer">
            <app-icon name="add" class="text-xl" />
          </button>
        }
      </div>
    </div>
    <div class="p-6">
      <app-data-table [data]="batiments()" [loading]="isLoad()" #dataTable>
        <thead>
          <tr>
            <th>Nom</th>
            <th class="text-center w-40">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (data of dataTable.pageData(); track data.id) {
            <tr>
              <td>{{ data.name }}</td>
              <td>
                <div class="flex items-center justify-center gap-2">
                  @if (can('modifier salle')) {
                    <button class="w-8 h-8 flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-dark transition-colors cursor-pointer text-xs" (click)="openEditModal(data)">
                      <i class="fa-solid fa-pen"></i>
                    </button>
                  }
                  @if (can('supprimer salle')) {
                    <button class="w-8 h-8 flex items-center justify-center rounded-full bg-danger text-white hover:bg-red-600 transition-colors cursor-pointer text-xs" (click)="openDeleteModal(data)">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  }
                </div>
              </td>
            </tr>
          }
        </tbody>
      </app-data-table>
    </div>
  </div>
</div>
