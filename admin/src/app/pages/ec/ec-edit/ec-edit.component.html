<div>
    <form [formGroup]="validateForm" (ngSubmit)="submitForm()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1.5" for="code">CODE UE <span class="text-danger">*</span></label>
                <input [(ngModel)]="ec.code" formControlName="code" name="code" type="text" id="code"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1.5" for="name">Nom UE <span class="text-danger">*</span></label>
                <input [(ngModel)]="ec.name" formControlName="name" name="name" type="text" id="name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
            </div>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1.5" for="vht">Nombre d'heure <span class="text-danger">*</span></label>
            <input [(ngModel)]="ec.vht" min="0" formControlName="vht" name="vht" type="number" id="vht"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
        </div>
    </form>
</div>
<div class="flex justify-end gap-3 px-4 py-3 border-t border-gray-100">
    <button type="button" (click)="destroyModal(null)" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">Annuler</button>
    <button type="button" (click)="save()" [disabled]="!validateForm.valid || isLoad" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-dark transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">@if (isLoad) {<i class="fa-solid fa-spinner fa-spin mr-2"></i>}Modifier</button>
</div>
