<div class="p-4">
    <form [formGroup]="validateForm">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Selectionner les permissions <span class="text-red-500">*</span></label>
            <select formControlName="permissions" multiple [(ngModel)]="selectedValue"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors min-h-[160px]">
                @for (item of permissions; track item) {
                    <option [ngValue]="item.name">{{ item.name.toUpperCase() }}</option>
                }
            </select>
            @if (isDataLoad) {
                <div class="mt-2 flex items-center gap-2 text-sm text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Chargement des permissions...
                </div>
            }
            @if (validateForm.get('permissions')?.invalid && validateForm.get('permissions')?.touched) {
                <span class="text-xs text-red-500 mt-1">Selectionner un role.</span>
            }
        </div>
    </form>
</div>

<div class="flex justify-end gap-3 px-4 py-3 border-t border-gray-100">
    <button (click)="destroyModal(null)"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">
        Annuler
    </button>
    <button (click)="save()" [disabled]="!validateForm.valid || isLoad"
        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer inline-flex items-center gap-2">
        @if (isLoad) {
            <i class="fa-solid fa-spinner fa-spin"></i>
        }
        Ajouter
    </button>
</div>
