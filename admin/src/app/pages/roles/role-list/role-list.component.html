@if (!allIsLoad) {
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden p-6">
    <!-- Tab buttons -->
    <div class="border-b border-gray-200 mb-4">
        <div class="flex flex-wrap gap-0">
            @for (item of roles; track item; let i = $index) {
                <button (click)="tabChange(item, i)"
                    class="px-4 py-3 text-sm font-medium transition-colors cursor-pointer"
                    [class]="activeTabIndex() === i
                        ? 'text-primary border-b-2 border-primary'
                        : 'text-gray-500 hover:text-gray-700 border-b-2 border-transparent'">
                    {{ item.name.toUpperCase() }}
                </button>
            }
        </div>
    </div>

    <!-- Active tab content -->
    @if (roles && roles.length > 0) {
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden p-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden p-4 mb-4">
                <div class="flex items-center gap-3">
                    <button (click)="openCreateModal(roles[activeTabIndex()])" class="w-9 h-9 flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-dark transition-colors cursor-pointer">
                        <app-icon name="add" />
                    </button>
                    <h4 class="text-sm font-medium text-gray-700">Ajouter une permission.</h4>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <app-data-table [data]="listOfDisplayData" [loading]="isLoad" #dataTable>
                    <thead>
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Permission</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (data of dataTable.pageData(); track data) {
                            <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                                <td class="px-4 py-3 text-sm text-gray-700">{{ data.name.toUpperCase() }}</td>
                                <td class="px-4 py-3">
                                    <div class="flex justify-end items-center">
                                        <button (click)="deletePermissionForRole(data, roles[activeTabIndex()])" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-100 transition-colors cursor-pointer" title="Supprimer">
                                            <app-icon name="delete" class="mat-18" />
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        }
                    </tbody>
                </app-data-table>
            </div>
        </div>
    }
</div>
} @else {
<div class="bg-white rounded-xl shadow-lg overflow-hidden">
    <div class="p-6 space-y-4">
        <div class="animate-pulse space-y-3">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="h-4 bg-gray-200 rounded w-1/2"></div>
            <div class="h-4 bg-gray-200 rounded w-5/6"></div>
        </div>
        <div class="animate-pulse space-y-3">
            <div class="h-4 bg-gray-200 rounded w-2/3"></div>
            <div class="h-4 bg-gray-200 rounded w-4/5"></div>
            <div class="h-4 bg-gray-200 rounded w-1/3"></div>
        </div>
        <div class="animate-pulse space-y-3">
            <div class="h-4 bg-gray-200 rounded w-5/6"></div>
            <div class="h-4 bg-gray-200 rounded w-1/2"></div>
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
        </div>
    </div>
</div>
}
