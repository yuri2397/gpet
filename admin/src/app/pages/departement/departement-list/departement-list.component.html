<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="bg-gradient-to-r from-[#1890ff] to-[#096dd9] px-6 py-4">
        <div class="flex justify-between items-center">
            <div>
                <h5 class="text-white text-lg font-semibold">Liste des departement</h5>
            </div>
            @if (can('creer departement')) {
                <div>
                    <button (click)="openCreateModal()" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 text-white transition-colors cursor-pointer">
                        <app-icon name="add" />
                    </button>
                </div>
            }
        </div>
    </div>
    <div class="p-6">
        <app-data-table [data]="departements()" [loading]="isLoad()" #dataTable>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th class="text-center">Nombre de classes</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (data of dataTable.pageData(); track data.id) {
                    <tr>
                        <td>{{ data.name }}</td>
                        <td class="text-center">{{ data.classes_count }}</td>
                        <td class="p-0">
                            <div class="flex justify-center">
                                <div class="mx-3">
                                    <a [routerLink]="['show/' + data.id]">
                                        <button class="w-8 h-8 flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-dark transition-colors cursor-pointer text-xs">
                                            <i class="fa-solid fa-eye"></i>
                                        </button>
                                    </a>
                                </div>
                                @if (can('modifier departement')) {
                                    <div class="mx-3">
                                        <button
                                            (click)="openEditModal(data)"
                                            class="w-8 h-8 flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-dark transition-colors cursor-pointer text-xs"
                                        >
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                    </div>
                                }
                                @if (can('supprimer departement')) {
                                    <div class="mx-3">
                                        <button
                                            (click)="openDeleteModal(data)"
                                            class="w-8 h-8 flex items-center justify-center rounded-full bg-danger text-white hover:bg-red-600 transition-colors cursor-pointer text-xs"
                                        >
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                }
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </app-data-table>
    </div>
</div>
