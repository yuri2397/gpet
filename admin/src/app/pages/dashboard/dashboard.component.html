@if (!isLoad()) {
<div>
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Dashboard</h2>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
    <app-stat-card label="Professeurs" [value]="dashboard().professors" icon="groups" link="/admin/professeurs" color="orange" />
    <app-stat-card label="Classes" [value]="dashboard().classes" icon="ballot" link="/admin/classes" color="green" />
    <app-stat-card label="Salles" [value]="dashboard().salles" icon="meeting_room" link="/admin/salles" color="red" />
    <app-stat-card label="Cours" [value]="dashboard().courses" icon="history_edu" link="/admin/courses" color="blue" />
  </div>

  <!-- Chart -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <div class="mb-4">
      <select (ngModelChange)="updateChart($event)" [(ngModel)]="selectedDay"
        class="w-full max-w-xs px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
        @for (item of days; track item.id) {
          <option [value]="item.id.toString()">{{ item.name | uppercase }}</option>
        }
      </select>
    </div>
    @if (!isLoadChart()) {
      <div id="chart">
        <apx-chart [series]="chartOptions.series!" [chart]="chartOptions.chart!" [dataLabels]="chartOptions.dataLabels!" [title]="chartOptions.title!" [colors]="chartOptions.colors!"></apx-chart>
      </div>
    } @else {
      <app-load></app-load>
    }
  </div>
</div>
} @else {
  <app-load></app-load>
}
