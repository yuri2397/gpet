@if (!isLoad() && dashboard(); as data) {
<div>
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <h2 class="text-2xl font-bold text-gray-800 m-0">Dashboard</h2>
    <app-dashboard-department-filter (departementChange)="onDepartementChange($event)" />
  </div>

  <app-dashboard-stat-grid [totals]="data.totals" [occupancyRate]="data.salle_occupancy_rate" />

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-6">
    <div class="lg:col-span-2">
      <app-dashboard-weekly-hours-chart [data]="data.weekly_hours" />
    </div>
    <div>
      <app-dashboard-course-status-chart [data]="data.courses_by_status" />
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-6">
    <app-dashboard-top-professors [data]="data.top_professors" />
    <app-dashboard-top-salles [data]="data.top_salles" />
    <app-dashboard-recent-courses [data]="data.recent_courses" />
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <div class="mb-4">
      <select (ngModelChange)="updateChart($event)" [(ngModel)]="selectedDay"
        class="w-full max-w-xs px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
        @for (item of days; track item.id) {
          <option [value]="item.id.toString()">{{ item.name | uppercase }}</option>
        }
      </select>
    </div>
    @if (!isLoadChart()) {
      <div id="chart">
        <apx-chart [series]="chartOptions.series!" [chart]="chartOptions.chart!" [dataLabels]="chartOptions.dataLabels!" [title]="chartOptions.title!" [colors]="chartOptions.colors!" [plotOptions]="chartOptions.plotOptions!"></apx-chart>
      </div>
    } @else {
      <app-load></app-load>
    }
  </div>
</div>
} @else {
  <app-load></app-load>
}
