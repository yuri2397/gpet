<div>
    <form [formGroup]="validateForm" (ngSubmit)="submitForm()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Classe <span class="text-red-500">*</span></label>
                    <select formControlName="classe_id" [(ngModel)]="course.classe_id"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                        <option [ngValue]="null" disabled>Selectionner la classe</option>
                        @for (o of classes; track o) {
                            <option [ngValue]="o.id">{{ o.name }}</option>
                        }
                    </select>
                    @if (isLoadClasse) {
                        <span class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Chargement...</span>
                    }
                </div>
            </div>
            <div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Professeur</label>
                    <input type="text" placeholder="Rechercher un professeur" (input)="onProSearch($any($event.target).value)"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" />
                    @if (profLoad) {
                        <span class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Recherche en cours...</span>
                    }
                    @if (professors && professors.length > 0) {
                        <select formControlName="professor_id" [(ngModel)]="course.professor_id"
                            class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                            <option [ngValue]="null">Aucun</option>
                            @for (o of professors; track o) {
                                <option [ngValue]="o.id">#{{ o.registration_number }} - {{ o.first_name }} {{ o.last_name }}</option>
                            }
                        </select>
                    }
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Service <span class="text-red-500">*</span></label>
                    <select formControlName="service_id" [(ngModel)]="course.service_id"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                        <option [ngValue]="null" disabled>Selectionner le service</option>
                        @for (o of services; track o) {
                            <option [ngValue]="o.id">{{ o.name }}</option>
                        }
                    </select>
                </div>
            </div>
            <div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Montant Horaire</label>
                    <input disabled [value]="serviceAmout(course.service_id)"
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-gray-50 text-gray-500" />
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">EC <span class="text-red-500">*</span></label>
                    <input type="text" placeholder="Rechercher un EC" (input)="onECSearch($any($event.target).value)"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" />
                    @if (ecLoad) {
                        <span class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Recherche en cours...</span>
                    }
                    @if (ecs && ecs.length > 0) {
                        <select formControlName="ec_id" [(ngModel)]="course.ec_id"
                            class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                            <option [ngValue]="null">Selectionner un EC</option>
                            @for (o of ecs; track o) {
                                <option [ngValue]="o.id">#{{ o.code }} - {{ o.name }}</option>
                            }
                        </select>
                    }
                    <button type="button" (click)="addEc()" class="mt-1 text-sm text-primary hover:text-primary-dark cursor-pointer">
                        + Nouveau EC
                    </button>
                </div>
            </div>
            <div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de groupe</label>
                    <input [(ngModel)]="course.groupe_number" formControlName="groupe_number" name="groupe_number" type="number" id="groupe_number"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors" />
                </div>
            </div>
            <div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Departement <span class="text-red-500">*</span></label>
                    <select [attr.disabled]="!courseService.isSuperAdmin() ? '' : null" formControlName="departement_id" [(ngModel)]="course.departement_id"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                        <option [ngValue]="null" disabled>Selectionner le departement</option>
                        @for (o of departements; track o) {
                            <option [ngValue]="o.id">{{ o.name }}</option>
                        }
                    </select>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="flex justify-end gap-3 px-4 py-3 border-t border-gray-100">
    <button type="button" (click)="destroyModal(null)"
        class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors cursor-pointer">
        Annuler
    </button>
    <button type="button" (click)="save()" [disabled]="!validateForm.valid"
        class="px-4 py-2 rounded-lg text-sm font-medium text-white bg-primary hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed transition-colors cursor-pointer">
        @if (isLoad) {
            <i class="fa-solid fa-spinner fa-spin mr-2"></i>
        }
        Ajouter
    </button>
</div>
