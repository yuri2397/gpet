<div>
  <form [formGroup]="validateForm" (ngSubmit)="submitForm()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <div class="mb-4">
          <label for="group" class="block text-sm font-medium text-gray-700 mb-1">Groupe (1 = commun)</label>
          <select [disabled]="groups?.length == 0" formControlName="group" id="group" name="group" [(ngModel)]="ept.group"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
            @for (g of groups; track g) {
              <option [value]="g">Groupe {{ g }}</option>
            }
          </select>
        </div>
      </div>
      <div>
        <div class="mb-4">
          <label for="salle_id" class="block text-sm font-medium text-gray-700 mb-1">Salle</label>
          <input type="text" placeholder="Rechercher une salle" (input)="onSalleSearch($any($event.target).value)"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors mb-1">
          <select formControlName="salle_id" [(ngModel)]="ept.salle.id"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
            <option [ngValue]="null">-- Selectionner --</option>
            @for (o of salles; track o.id) {
              <option [value]="o.id">{{ o.name }}</option>
            }
          </select>
          @if (isSallesLoad) {
            <p class="text-xs text-gray-400 mt-1"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Rechercher une salle</p>
          }
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4">
      <div>
        <div class="mb-4">
          <label for="course_id" class="block text-sm font-medium text-gray-700 mb-1">Cour <span class="text-red-500">*</span></label>
          <select (ngModelChange)="setGroupes($event)" formControlName="course_id" [(ngModel)]="ept.course.id"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
            <option [ngValue]="null">-- Selectionner --</option>
            @for (o of courses; track o.id) {
              <option [value]="o.id">{{ o.name }}</option>
            }
          </select>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <div class="mb-4">
          <label for="start" class="block text-sm font-medium text-gray-700 mb-1">Debut cour <span class="text-red-500">*</span></label>
          <input type="time" [(ngModel)]="ept.start" formControlName="start" name="start" id="start" step="900"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
          @if (validateForm.get('start')?.invalid && validateForm.get('start')?.touched) {
            <p class="text-red-500 text-xs mt-1">Heure de debut requi</p>
          }
        </div>
      </div>
      <div>
        <div class="mb-4">
          <label for="end" class="block text-sm font-medium text-gray-700 mb-1">Fin cour <span class="text-red-500">*</span></label>
          <input type="time" [(ngModel)]="ept.end" formControlName="end" name="end" id="end" step="900"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
          @if (validateForm.get('end')?.invalid && validateForm.get('end')?.touched) {
            <p class="text-red-500 text-xs mt-1">Heure de fin requi</p>
          }
        </div>
      </div>
    </div>
  </form>
</div>

<div class="flex justify-end gap-3 px-4 py-3 border-t border-gray-100">
  <button (click)="destroyModal(null)" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">Annuler</button>
  <button (click)="edit()" [disabled]="!validateForm.valid" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
    @if (isLoad) {
      <i class="fa-solid fa-spinner fa-spin mr-2"></i>
    }
    Enregistrer
  </button>
</div>
