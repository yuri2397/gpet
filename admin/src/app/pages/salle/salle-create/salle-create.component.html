<div>
    <form [formGroup]="validateForm">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="mb-4">
                    <label for="number" class="block text-sm font-medium text-gray-700 mb-1">Numero de la salle <span class="text-red-500">*</span></label>
                    <input [(ngModel)]="salle.number" formControlName="number" name="number" type="number" id="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                </div>
            </div>
            <div>
                <div class="mb-4">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nom de la salle</label>
                    <input [(ngModel)]="salle.name" formControlName="name" name="name" type="text" id="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="mb-4">
                    <label for="batiment_id" class="block text-sm font-medium text-gray-700 mb-1">Batiment <span class="text-red-500">*</span></label>
                    <select formControlName="batiment_id" [(ngModel)]="salle.batiment_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                        @for (o of batiments; track o) {
                            @if (!isLoadData) {
                                <option [value]="o.id">{{ o.name }}</option>
                            }
                        }
                    </select>
                </div>
            </div>
            <div>
                <div class="mb-4">
                    <label for="departement_id" class="block text-sm font-medium text-gray-700 mb-1">Departement <span class="text-red-500">*</span></label>
                    <select [disabled]="salleService.isEditeur()" formControlName="departement_id" [(ngModel)]="salle.departement_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
                        @for (o of departements; track o) {
                            @if (!isLoadData) {
                                <option [value]="o.id">{{ o.name }}</option>
                            }
                        }
                    </select>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label for="capacity" class="block text-sm font-medium text-gray-700 mb-1">Capacite</label>
            <input [(ngModel)]="salle.capacity" formControlName="capacity" value="0" name="capacity" type="number" id="capacity" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors">
        </div>
    </form>
</div>

<div class="flex justify-end gap-3 px-4 py-3 border-t border-gray-100">
    <button type="button" (click)="destroyModal(null)" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">Annuler</button>
    <button type="button" (click)="save()" [disabled]="!validateForm.valid || isLoad" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-dark transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">@if (isLoad) {<i class="fa-solid fa-spinner fa-spin mr-2"></i>}Ajouter</button>
</div>
